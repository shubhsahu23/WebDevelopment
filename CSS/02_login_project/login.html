<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body{
      background-color: #1a1a1a;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;

    }
    .card{
      background-color: #c8c7c7;
      border-radius: 8px;
      padding: 30px;
      width: 300px;
      height: 200px;

    }
    h1{
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 8px;
    }
    form{
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    input{
      margin-bottom: 2px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid black ;
    }
    button{
      background-color: #2e6db0;
      padding: 2px;
      border-radius: 2px;
      color: white;
    }
    button:hover{
      background-color: #0bbaeb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <form action="">
      <label for="email">Email</label>
      <input type="email" placeholder="Email">
      
      <label for="password">Password</label>
      <input type="password" placeholder="password">

      <button type="submit">submit</button>

    </form>
  </div>
</body>
</html>
